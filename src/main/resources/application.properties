server.port=8080

# Application Details
spring.application.name=mediai-system

# MySQL Database Configuration (Environment variable overrides supported)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mediai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Jesica@5}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# JPA & Hibernate ORM Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Static resource handling: Spring Boot serves /static as root
spring.web.resources.static-locations=classpath:/static/

# AI / ML Service Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# JWT Security Configuration
jwt.secret=${JWT_SECRET:MediAiSecretKeyForClinicalStaffAuthTokensMustBeAtLeast32BytesLong}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.com.mediai=INFO
logging.level.org.springframework.web=INFO
